[workspace]
members = [".", "game-scanner-ffi", "gui/src-tauri"]
resolver = "2"

[package]
edition = "2021"
build = "build.rs"
name = "game-scanner"
description = "Game Scanner for any launcher and OS"
version = "1.2.0"
authors = ["Matheus Albino <matheusalbino@users.noreply.github.com>"]
license = "MIT"
keywords = ["api-bindings", "games"]
categories = ["api-bindings", "games"]
homepage = "https://github.com/EqualGames/game-scanner"
repository = "https://github.com/EqualGames/game-scanner"
readme = "README.md"
include = [
    "src/**/*.proto",
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
]

[lib]
name = "game_scanner"
crate-type = ["rlib", "cdylib"]

[[bench]]
name = "list"
harness = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
serde_yaml = { version = "0.9.34" }
url = { version = "2.5.8" }
sysinfo = { version = "0.39.5" }
prost = { version = "0.14.4" }
prost-types = { version = "0.14.4" }
bytes = { version = "1.12.1" }
chrono = { version = "0.4.45" }
directories = { version = "6.0.0" }

[target.'cfg(unix)'.dependencies]
rusqlite = { version = "0.40.1",  features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
case = { version = "1.0.0" }
winreg = { version = "0.56.0" }
rusqlite = { version = "0.40.1", features = ["bundled-windows"] }
windows = { version = "0.61", features = [
    "Management_Deployment",
    "ApplicationModel",
] }
quick-xml = "0.41"

[dev-dependencies]
criterion = { version = "0.8.2" }

[build-dependencies]
prost-build = { version = "0.14.4" }
protoc-bin-vendored = { version = "3.2.0" }
