[package]
name = "game-scanner-gui"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 demo application for the game-scanner library"
publish = false

[lib]
name = "game_scanner_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
game-scanner = { path = "../.." }
