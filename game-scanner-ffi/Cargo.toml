[package]
name = "game-scanner-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI for the game-scanner library"
license = "MIT"
publish = false

[lib]
name = "game_scanner_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
game-scanner = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
